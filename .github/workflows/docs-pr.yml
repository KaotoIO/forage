name: Docs PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'forage-catalog/**'

jobs:
  validate:
    if: github.repository == 'KaotoIO/forage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate catalog
        run: mvn -B --no-transfer-progress install -DskipTests -pl forage-catalog -am

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: website/requirements.txt

      - name: Install dependencies
        run: pip install -r website/requirements.txt

      - name: Validate docs build
        run: mkdocs build --strict
        working-directory: website
